# 打 v* 标签后自动发布 GitHub Release，附带工作室安装包与 manifest.json；
# 工作室库控制台的「有更新」与升级读取的就是这里的 Release。也可手动运行，为已有标签补发 Release。
name: 发布 Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要补发 Release 的已有标签，例如 v0.2.3'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 检查安装入口
        run: node scripts/check-install.mjs

      - name: 生成 Release 资产
        run: node scripts/release-assets.mjs

      - name: 创建或更新 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* --verify-tag --title "$RELEASE_TAG" \
              --notes "$GITHUB_REPOSITORY $RELEASE_TAG。附带工作室安装包与 manifest.json，供工作室库控制台检查更新与一键升级。"
          fi

      # 设计工作室「组件知识库 → GitHub · 最新发布」默认读取本仓库的 knowledge 分支：每次发布把内置快照同步过去。
      # 只在推送标签时执行；手动为旧标签补发 Release 时跳过，避免旧资料覆盖新资料。
      - name: 同步完整知识库到 knowledge 分支
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/export-knowledge.mjs
          node scripts/publish-knowledge.mjs
