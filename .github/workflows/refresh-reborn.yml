name: Build latest Reborn knowledge
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
concurrency:
  group: reborn-knowledge
  cancel-in-progress: false
jobs:
  knowledge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: 1997liuyh-boop/Reborn-UI
          ref: main
          path: .reborn-source
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: 从干净源码生成并验证完整知识库
        working-directory: .reborn-source
        run: |
          pnpm install --frozen-lockfile
          pnpm kb:bootstrap
          pnpm kb:check
          git diff --exit-code
      - run: node scripts/sync-reborn.mjs .reborn-source
      - run: npm run build
      - run: npm run check
      - run: npm test
      - run: npm run pack
      - run: node scripts/export-knowledge.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: reborn-knowledge
          path: artifacts/reborn-knowledge
      - uses: actions/upload-artifact@v4
        with:
          name: design-with-latest-reborn
          path: |
            artifacts/*.tgz
            artifacts/manifest.json
            REBORN-SNAPSHOT.json
      - name: 发布只包含资料的 GitHub 分支
        run: node scripts/publish-knowledge.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
