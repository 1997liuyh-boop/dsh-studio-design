name: Check and package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  package:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npm test
      - run: npm run pack
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-studio-design-${{ matrix.os }}
          path: artifacts/*
